apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
  namespace: messager-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-service
  template:
    metadata:
      labels:
        app: message-service
    spec:
      containers:
        - name: message-service
          image: mablinov2704/message-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: HTTP_PORT
              value: "8082"
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: messager-db-secret
                  key: MSG_DB_DSN
            - name: UPLOADS_DIR
              value: "/tmp/uploads"
---
apiVersion: v1
kind: Service
metadata:
  name: message-service
  namespace: messager-dev
spec:
  selector:
    app: message-service
  ports:
    - port: 8082
      targetPort: 8082