apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      initContainers:
      - name: create-databases
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          psql -h localhost -U messager -c "CREATE DATABASE messager_users;" || true
          psql -h localhost -U messager -c "CREATE DATABASE messager_messages;" || true
        env:
        - name: PGPASSWORD
          value: "messager"
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "messager"
        - name: POSTGRES_PASSWORD
          value: "messager"
        - name: POSTGRES_DB
          value: "messager"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi