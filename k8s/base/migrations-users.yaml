apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-users
spec:
  template:
    spec:
      containers:
      - name: goose-migrate
        image: ghcr.io/kukymbr/goose-docker:latest
        command: ["goose", "-dir", "/migrations", "postgres", "$(GOOSE_DBSTRING)", "up"]
        env:
        - name: GOOSE_DRIVER
          value: "postgres"
        - name: GOOSE_DBSTRING
          value: "host=postgres user=messager password=messager dbname=messager_users sslmode=disable"
        - name: GOOSE_MIGRATION_DIR
          value: "/migrations"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      volumes:
      - name: migrations
        configMap:
          name: user-migrations-cm
      restartPolicy: Never
  backoffLimit: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-migrations-cm
data:
  001_init.sql: |
    -- +goose Up
    CREATE TABLE IF NOT EXISTS users (
        id         TEXT PRIMARY KEY,
        name       TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    
    CREATE INDEX IF NOT EXISTS idx_users_name ON users (name);
    
    -- +goose Down
    DROP TABLE IF EXISTS users;